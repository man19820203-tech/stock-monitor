# 台股當沖盤中監控：每個交易日早上在 GitHub 的機器上自動執行，用 Telegram 推播提醒，收盤後自動結束。
# 設定步驟見 docs/雲端部署_GitHub_Actions_Telegram.md
name: 盤中監控

on:
  schedule:
    # 週一到週五 00:23 UTC = 台北 08:23。GitHub 排程常延遲幾分鐘到半小時，所以提早觸發，
    # 程式會自己等到 config cloud.start_time（08:45）才開始；故意避開整點，整點排程最容易塞車
    - cron: "23 0 * * 1-5"
    # 備援：GitHub 尖峰時段會直接漏掉排程（10/22 那次 08:23 完全沒有觸發）。
    # 前一次還在跑的話，備援會被下面的 concurrency 排在後面，等前一次 13:35 結束後才開始，
    # 那時已過結束時間，cloud_run.py 會直接結束，只多花不到 1 分鐘
    - cron: "38 0 * * 1-5"    # 台北 08:38
    - cron: "52 0 * * 1-5"    # 台北 08:52
    - cron: "7 1 * * 1-5"     # 台北 09:07（前面都漏掉時的最後一道；第一高低會用 1 分K 補回）
  workflow_dispatch:
    inputs:
      minutes:
        description: "測試用：跑幾分鐘就結束（留空 = 正常盤中模式）"
        required: false
        default: ""

permissions:
  contents: write   # 把 Telegram /add /remove 改過的自選股存回 repo
  actions: write    # 保持排程啟用（見最後一步）

# 同一時間只跑一個（兩個程式用同一個 Bot Token 收訊息會互相衝突）
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # GitHub 單次上限 6 小時；08:23 觸發、13:35 結束約 5 小時 12 分（排隊等待的時間不算）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行盤中監控
        env:
          FUGLE_API_TOKEN: ${{ secrets.FUGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINUTES: ${{ inputs.minutes }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$MINUTES" ]; then
            python cloud_run.py --minutes "$MINUTES"
          else
            python cloud_run.py
          fi

      - name: 保存自選股
        if: always()
        run: |
          if git diff --quiet -- data/user_watchlist.json; then
            echo "自選股沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/user_watchlist.json
          git commit -m "更新自選股（Telegram 指令）"
          git pull --rebase   # 盤中有人改過 repo（例如在網頁上改設定）時，直接 push 會被拒
          git push

      - name: 保持排程啟用
        # public repo 60 天沒有任何 commit，GitHub 會自動停用排程；每次執行都重新啟用一次來重置計時
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable monitor.yml --repo "$GITHUB_REPOSITORY" || true
