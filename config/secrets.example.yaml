# 複製這個檔案成 config/secrets.yaml（同一個資料夾），填入你自己的金鑰。
# config/secrets.yaml 已列入 .gitignore，不會被上傳到 GitHub。
# 在 GitHub Actions 上跑的時候不用這個檔案，改用 repo 的 Secrets（見 docs/雲端部署_GitHub_Actions_Telegram.md）。
data_source:
  fugle:
    api_token: ""      # 富果 API Key：https://developer.fugle.tw/docs/key/

telegram:
  bot_token: ""        # 跟 @BotFather 建立機器人後拿到的 Token（像 123456789:AAxxxx...）
  chat_id: ""          # 你自己的 Telegram 帳號 ID（機器人只回應、只推播給這個 ID）
